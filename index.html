<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Onsen UI - Home</title>

  <!-- Onsen UI CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/onsenui/css/onsenui.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/onsenui/css/onsen-css-components.min.css">
  <script src="https://cdn.jsdelivr.net/npm/onsenui/js/onsenui.min.js"></script>
  <link rel="manifest" href="manifest.json">

</head>
<body>

  <!-- Navigator agar bisa berpindah antar template -->
  <ons-navigator id="navigator" page="home.html"></ons-navigator>

  <!-- 🏠 Template: Halaman Home -->
  <template id="home.html">
    <ons-page id="home">
      <ons-toolbar>
        <div class="center">Home</div>
      </ons-toolbar>

      <div style="padding:16px;">
        <h2>Selamat Datang di Aplikasi Web GIS Perumda Air Minum Tirta Sanjiwani</h2>
        <p>Aplikasi ini memiliki feature MAP untuk mengetahui posisi aset dan menentukan posisi aset: <strong>Home</strong>, <strong>Maps</strong>, dan <strong>Contact</strong>.</p>

        <ons-button modifier="large" onclick="window.location.href='maps.html'">
          Buka Halaman Maps
        </ons-button>

        <div style="height:12px"></div>

        <!-- ✅ kutip sudah benar -->
        <ons-button modifier="large" onclick="document.getElementById('navigator').pushPage('contact.html')">
          Buka Halaman Contact
        </ons-button>

        <div style="height:12px"></div>

        <ons-button modifier="large" id="subscribe">
          Aktifkan Notifikasi
        </ons-button>

        <div style="height:12px"></div>

        <ons-button modifier="large"onclick="window.location.href='pemetaan.html'">
          Pemataan
        </ons-button>

        <div style="height:12px"></div>

       <ons-button modifier="large" onclick="document.getElementById('navigator').pushPage('settingPage.html')">
          Setting API Access
        </ons-button>

        <ons-card style="margin-top:16px;">
          <div class="title">Catatan</div>
          <div class="content">Jika Terjadi error saat akses aplikasi segera hubungi divisi pemetaan atau divisi IT</div>
        </ons-card>

      </div>
    </ons-page>
  </template>

  <!-- 📇 Template: Halaman Contact -->
  <template id="contact.html">
    <ons-page id="contact">
      <ons-toolbar>
        <div class="left">
          <ons-back-button>Kembali</ons-back-button>
        </div>
        <div class="center">Contact</div>
      </ons-toolbar>

      <div style="padding:16px;">
        <ons-card>
          <div class="title">Hubungi Kami</div>
          <div class="content">
            <p>Jika Anda memiliki pertanyaan, silakan hubungi kami melalui:</p>
            <ul>
              <li><strong>Email:</strong> info@contoh.com</li>
              <li><strong>Telepon:</strong> +62 812-3456-7890</li>
              <li><strong>Alamat:</strong> Gianyar, Bali</li>
            </ul>
          </div>
        </ons-card>

        <ons-list-title>Kirim Pesan</ons-list-title>
        <ons-list>
          <ons-list-item>
            <div class="center">
              <ons-input placeholder="Nama" float></ons-input>
            </div>
          </ons-list-item>
          <ons-list-item>
            <div class="center">
              <ons-input placeholder="Email" float></ons-input>
            </div>
          </ons-list-item>
          <ons-list-item>
            <div class="center">
              <ons-textarea placeholder="Pesan" rows="3" float></ons-textarea>
            </div>
          </ons-list-item>
        </ons-list>

        <ons-button modifier="large" style="margin-top:12px;" onclick="ons.notification.alert('Pesan terkirim!')">
          Kirim
        </ons-button>
      </div>
    </ons-page>
  </template>

    <!-- 📇 Template: Halaman Contact -->
  <template id="settingPage.html">
    <ons-page id="settingPage">
      <ons-toolbar>
        <div class="left">
          <ons-back-button>Kembali</ons-back-button>
        </div>
        <div class="center">Setting</div>
      </ons-toolbar>

      <div style="padding:16px;">  

   <ons-list-title>Alamat API</ons-list-title>
  <ons-list>
    <ons-list-item>
      <div class="center">
        <ons-input placeholder="Alamat API" float id="api" style="width: 100%;"></ons-input>
      </div>
    </ons-list-item>
  </ons-list>

  <ons-button modifier="large" style="margin-top:12px;" onclick="simpanApi()">
    Simpan
  </ons-button>
      </div>
    </ons-page>
  </template>
  <script>
    // Register Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
          .then(reg => console.log('Service Worker registered ✅', reg))
          .catch(err => console.warn('Service Worker failed 💥', err));
      });
    }
    

</script>

  <script>
    // Saat halaman selesai dimuat
    document.addEventListener('init', function (event) {
      if (event.target.id === 'settingPage') {
        const savedApi = localStorage.getItem('base_api');
        if (savedApi) {
          document.getElementById('api').value = savedApi;
        }
      }
    });

    // Fungsi simpan ke localStorage
    function simpanApi() {
      const api = document.getElementById('api').value.trim();
      if (api) {
        localStorage.setItem('base_api', api);
        ons.notification.toast('Alamat API disimpan!', { timeout: 2000 });
      } else {
        ons.notification.alert('Isi dulu alamat API!');
      }
    }
  </script>
  
<!-- Load idb dulu -->

  <script src="./js/db.js"></script>
</body>
</html>
